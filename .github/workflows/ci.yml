name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # Ağır torch/ultralytics CI'da gerekmez — inference.py bunları tembel
        # (lazy) import eder. Headless OpenCV görüntü/GUI bağımlılığı çekmez.
        run: |
          python -m pip install --upgrade pip
          pip install \
            pyyaml numpy "opencv-python-headless>=4.9" psutil \
            fastapi "uvicorn[standard]" pydantic pillow websockets \
            pytest ruff

      - name: Ruff lint
        run: ruff check .

      - name: Byte-compile all sources
        run: |
          python -m py_compile \
            main.py core/*.py core/modules/*.py api/*.py

      - name: Run tests
        run: pytest
